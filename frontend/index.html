<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Relay Operations</title>
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist Sans for the interface, Geist Mono for IDs, clocks and counts. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" />
    <script>
      // Paint the stored appearance before first paint, so a dark-mode reload
      // never flashes white. Mirrors the reducer in lib/theme.js.
      (function () {
        try {
          var t = localStorage.getItem('relay.theme')
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) { /* private mode: fall back to the system appearance */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
